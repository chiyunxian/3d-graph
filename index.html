<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b14">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>方程空间 · 3D 方程构图器</title>
<meta name="description" content="输入三个方程，在 x、y、z 三维空间中绘制曲面与围合图形。支持显式 z=f(x,y) 与隐式 F(x,y,z)=0。">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<div id="app">
  <aside class="panel">
    <div class="brand">
      <div class="brand-mark">xyz</div>
      <div>
        <h1>方程空间</h1>
        <p>3D EQUATION PLOTTER</p>
      </div>
    </div>

    <section class="section">
      <div class="section-head">
        <span>方程 / Equations</span>
        <span>
          <button class="preset" type="button" data-preset="cylinder">圆柱</button>
          <button class="preset" type="button" data-preset="cone">锥面</button>
        </span>
      </div>
      <div class="eq-list" id="eq-list">
        <label class="eq-row" data-index="0" style="--c:#60a5fa">
          <span class="eq-dot"></span>
          <input class="eq-input" type="text" spellcheck="false" autocomplete="off" placeholder="例如：x^2 + y^2 = 4" aria-label="方程 1">
          <button class="eq-clear" type="button" aria-label="清空方程 1">×</button>
          <span class="eq-error" role="alert"></span>
        </label>
        <label class="eq-row" data-index="1" style="--c:#f472b6">
          <span class="eq-dot"></span>
          <input class="eq-input" type="text" spellcheck="false" autocomplete="off" placeholder="例如：z = 0" aria-label="方程 2">
          <button class="eq-clear" type="button" aria-label="清空方程 2">×</button>
          <span class="eq-error" role="alert"></span>
        </label>
        <label class="eq-row" data-index="2" style="--c:#34d399">
          <span class="eq-dot"></span>
          <input class="eq-input" type="text" spellcheck="false" autocomplete="off" placeholder="例如：z = 4" aria-label="方程 3">
          <button class="eq-clear" type="button" aria-label="清空方程 3">×</button>
          <span class="eq-error" role="alert"></span>
        </label>
      </div>
      <p class="hint">支持 <code>z = f(x,y)</code> 与隐式 <code>F(x,y,z)=0</code>；函数：sin、cos、sqrt、exp、abs、log 等。</p>
    </section>

    <section class="section">
      <div class="control">
        <div class="control-row"><label for="range">坐标范围</label><output id="range-out">−5 … 5</output></div>
        <input id="range" type="range" min="2" max="8" step="1" value="5">
      </div>
      <div class="control">
        <div class="control-row"><label for="quality">采样精度</label></div>
        <select id="quality">
          <option value="36">标准 · 36</option>
          <option value="48" selected>精细 · 48</option>
          <option value="64">高精度 · 64</option>
        </select>
      </div>
    </section>

    <div class="actions">
      <button class="btn primary" id="render-btn" type="button">绘制图形 <kbd>Enter</kbd></button>
      <button class="btn" id="reset-btn" type="button">重置</button>
    </div>

    <div class="toggles">
      <label class="toggle"><input type="checkbox" id="show-grid" checked>显示网格</label>
      <label class="toggle"><input type="checkbox" id="show-axes" checked>显示坐标轴</label>
      <label class="toggle"><input type="checkbox" id="show-intersections" checked>显示交线</label>
      <label class="toggle"><input type="checkbox" id="auto-rotate">自动旋转</label>
    </div>

    <div class="panel-foot">
      拖拽旋转 · 滚轮缩放 · 右键/双指平移<br>
      隐式曲面以点云呈现，交线以金色点标出。
    </div>
  </aside>

  <main class="stage">
    <div id="viewport"></div>
    <div class="overlay-top">
      <p class="kicker">Three-dimensional space</p>
      <h2>x · y · z</h2>
      <p>输入方程，观察曲面如何围出空间。</p>
    </div>
    <div id="status" role="status">准备就绪</div>
    <div id="legend"></div>
    <div class="view-hint"><kbd>拖拽</kbd> 旋转　<kbd>滚轮</kbd> 缩放</div>
    <div id="loading"><div><div class="spinner"></div>正在计算曲面…</div></div>
  </main>
</div>

<script src="three.min.js?v=2"></script>
<script src="OrbitControls.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
